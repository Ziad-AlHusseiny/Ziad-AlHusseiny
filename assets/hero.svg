<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ziad AlHusseiny, Software Engineer">
  <title>Ziad AlHusseiny — Software Engineer</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#0a0a0a"/>
      <stop offset="0.8" stop-color="#1c1c1c"/>
      <stop offset="0.94" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#585858"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.38" stop-color="#cfcfcf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8b8b8"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .n { font: 700 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill:#ffffff; letter-spacing:-1.5px; }
      .t { font: 500 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill:#9a9a9a; letter-spacing:3.4px; }
      .a1{ opacity:0; animation:up .9s cubic-bezier(.2,.9,.3,1) .3s forwards }
      .a2{ opacity:0; animation:up .9s cubic-bezier(.2,.9,.3,1) .6s forwards }
      @keyframes up { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
      .sun{ animation:rise 2.2s cubic-bezier(.25,.8,.35,1) .1s both }
      @keyframes rise { from{transform:translateY(70px);opacity:0} to{transform:translateY(0);opacity:1} }
      .halo{ transform-origin:200px 250px; animation:breathe 6s ease-in-out 2s infinite }
      @keyframes breathe { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
      .st{ animation:tw 3.4s ease-in-out infinite }
      @keyframes tw { 0%,100%{opacity:.1} 50%{opacity:.75} }
      .car{ animation:bl 1.05s steps(1) infinite }
      @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .swp{ animation:sweep 7s ease-in-out 1.5s infinite }
      @keyframes sweep { 0%,100%{opacity:.3} 50%{opacity:1} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <g fill="#ffffff">
      <circle class="st" cx="90"   cy="46"  r="1.6" style="animation-delay:0s"/>
      <circle class="st" cx="180"  cy="88"  r="1.1" style="animation-delay:.6s"/>
      <circle class="st" cx="286"  cy="38"  r="1.8" style="animation-delay:1.2s"/>
      <circle class="st" cx="352"  cy="104" r="1.2" style="animation-delay:.3s"/>
      <circle class="st" cx="470"  cy="54"  r="1.5" style="animation-delay:1.8s"/>
      <circle class="st" cx="548"  cy="96"  r="1"   style="animation-delay:.9s"/>
      <circle class="st" cx="640"  cy="34"  r="1.7" style="animation-delay:2.3s"/>
      <circle class="st" cx="726"  cy="80"  r="1.2" style="animation-delay:.15s"/>
      <circle class="st" cx="812"  cy="48"  r="1.5" style="animation-delay:1.5s"/>
      <circle class="st" cx="900"  cy="98"  r="1.1" style="animation-delay:2.7s"/>
      <circle class="st" cx="982"  cy="40"  r="1.9" style="animation-delay:.45s"/>
      <circle class="st" cx="1064" cy="86"  r="1.3" style="animation-delay:2s"/>
      <circle class="st" cx="1136" cy="52"  r="1.5" style="animation-delay:1.1s"/>
      <circle class="st" cx="430"  cy="140" r="1"   style="animation-delay:2.5s"/>
      <circle class="st" cx="1010" cy="132" r="1.1" style="animation-delay:.75s"/>
    </g>

    <g class="sun">
      <circle class="halo" cx="200" cy="250" r="155" fill="url(#glow)"/>
      <circle cx="200" cy="250" r="58" fill="url(#disc)"/>
    </g>

    <rect class="swp" x="0" y="249" width="1200" height="1.2" fill="url(#horizon)"/>

    <g class="a1"><text class="t" x="392" y="145">SOFTWARE ENGINEER</text></g>
    <g class="a2"><text class="n" x="390" y="205">Ziad AlHusseiny<tspan class="car" dx="10" fill="#ffffff">▍</tspan></text></g>

    <rect width="1200" height="340" fill="url(#vig)"/>
    <rect width="1200" height="340" filter="url(#grain)" opacity="0.10"/>
  </g>
</svg>
