<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 198" width="840" height="198" role="img" aria-label="GitHub statistics">
<title>GitHub statistics</title>
<defs><style>
.lbl{font:500 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#8a8a8a}
.val{font:700 30px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#ffffff}
.hd{font:600 14px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#c8c8c8;letter-spacing:2px}
.lg{font:500 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#ffffff}
.f{opacity:0;animation:f .7s ease-out forwards}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bar{transform:scaleX(0);transform-origin:left center;animation:g 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes g{to{transform:scaleX(1)}}
</style></defs>
<rect width="840" height="198" rx="14" fill="#0b0b0b"/>
<text class="hd" x="30" y="38">GITHUB STATS</text>
<g class="f" style="animation-delay:0.10s">
<text class="val" x="30" y="82">35</text>
<text class="lbl" x="30" y="102">Public repos</text>
</g>
<g class="f" style="animation-delay:0.18s">
<text class="val" x="298" y="82">18</text>
<text class="lbl" x="298" y="102">Commits this year</text>
</g>
<g class="f" style="animation-delay:0.26s">
<text class="val" x="566" y="82">1</text>
<text class="lbl" x="566" y="102">Pull requests</text>
</g>
<line x1="30" y1="132" x2="810" y2="132" stroke="#242424" stroke-width="1"/>
<rect class="bar" x="30.0" y="146" width="414.8" height="8" rx="4" fill="#ffffff" style="animation-delay:0.50s"/>
<rect class="bar" x="446.8" y="146" width="163.4" height="8" rx="4" fill="#c4c4c4" style="animation-delay:0.60s"/>
<rect class="bar" x="612.2" y="146" width="112.9" height="8" rx="4" fill="#909090" style="animation-delay:0.70s"/>
<rect class="bar" x="727.1" y="146" width="49.7" height="8" rx="4" fill="#5f5f5f" style="animation-delay:0.80s"/>
<rect class="bar" x="778.8" y="146" width="39.2" height="8" rx="4" fill="#3b3b3b" style="animation-delay:0.90s"/>
<g class="f" style="animation-delay:0.80s">
<circle cx="35" cy="172" r="5" fill="#ffffff"/>
<text class="lg" x="46" y="177">Python 51.8%</text>
</g>
<g class="f" style="animation-delay:0.87s">
<circle cx="144.6" cy="172" r="5" fill="#c4c4c4"/>
<text class="lg" x="155.6" y="177">TypeScript 20.4%</text>
</g>
<g class="f" style="animation-delay:0.94s">
<circle cx="284.6" cy="172" r="5" fill="#909090"/>
<text class="lg" x="295.6" y="177">PLpgSQL 14.1%</text>
</g>
<g class="f" style="animation-delay:1.01s">
<circle cx="401.8" cy="172" r="5" fill="#5f5f5f"/>
<text class="lg" x="412.8" y="177">HTML 6.2%</text>
</g>
<g class="f" style="animation-delay:1.08s">
<circle cx="496.20000000000005" cy="172" r="5" fill="#3b3b3b"/>
<text class="lg" x="507.20000000000005" y="177">JavaScript 4.9%</text>
</g>
</svg>