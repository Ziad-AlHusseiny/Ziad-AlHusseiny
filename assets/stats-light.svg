<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" role="img" aria-label="GitHub statistics">
<title>GitHub statistics</title>
<defs><style>
.lbl{font:500 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#5b678a}
.val{font:700 30px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#1b2340}
.hd{font:600 14px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#d97a3c;letter-spacing:2px}
.lg{font:500 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#1b2340}
.f{opacity:0;animation:f .7s ease-out forwards}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bar{transform:scaleX(0);transform-origin:left center;animation:g 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes g{to{transform:scaleX(1)}}
</style></defs>
<rect width="840" height="260" rx="14" fill="#ffffff"/>
<text class="hd" x="30" y="38">GITHUB STATS</text>
<g class="f" style="animation-delay:0.10s">
<text class="val" x="30" y="82">23</text>
<text class="lbl" x="30" y="102">Public repos</text>
</g>
<g class="f" style="animation-delay:0.18s">
<text class="val" x="298" y="82">14</text>
<text class="lbl" x="298" y="102">Commits this year</text>
</g>
<g class="f" style="animation-delay:0.26s">
<text class="val" x="566" y="82">1</text>
<text class="lbl" x="566" y="102">Pull requests</text>
</g>
<line x1="30" y1="206" x2="810" y2="206" stroke="#e3e8f2" stroke-width="1"/>
<rect class="bar" x="30.0" y="220" width="541.0" height="8" rx="4" fill="#3572A5" style="animation-delay:0.50s"/>
<rect class="bar" x="573.0" y="220" width="95.1" height="8" rx="4" fill="#e34c26" style="animation-delay:0.60s"/>
<rect class="bar" x="670.1" y="220" width="74.7" height="8" rx="4" fill="#f1e05a" style="animation-delay:0.70s"/>
<rect class="bar" x="746.8" y="220" width="39.3" height="8" rx="4" fill="#663399" style="animation-delay:0.80s"/>
<rect class="bar" x="788.1" y="220" width="29.9" height="8" rx="4" fill="#3178c6" style="animation-delay:0.90s"/>
<g class="f" style="animation-delay:0.80s">
<circle cx="35" cy="246" r="5" fill="#3572A5"/>
<text class="lg" x="46" y="251">Python 68.8%</text>
</g>
<g class="f" style="animation-delay:0.87s">
<circle cx="144.6" cy="246" r="5" fill="#e34c26"/>
<text class="lg" x="155.6" y="251">HTML 12.1%</text>
</g>
<g class="f" style="animation-delay:0.94s">
<circle cx="239.0" cy="246" r="5" fill="#f1e05a"/>
<text class="lg" x="250.0" y="251">JavaScript 9.5%</text>
</g>
<g class="f" style="animation-delay:1.01s">
<circle cx="379.0" cy="246" r="5" fill="#663399"/>
<text class="lg" x="390.0" y="251">CSS 5.0%</text>
</g>
<g class="f" style="animation-delay:1.08s">
<circle cx="465.8" cy="246" r="5" fill="#3178c6"/>
<text class="lg" x="476.8" y="251">TypeScript 3.8%</text>
</g>
</svg>