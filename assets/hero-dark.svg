<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ziad AlHusseiny, iOS Developer, Swift and SwiftUI">
  <title>Ziad AlHusseiny — iOS Developer</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1c"/>
      <stop offset="0.46" stop-color="#141d42"/>
      <stop offset="0.74" stop-color="#38325f"/>
      <stop offset="0.9" stop-color="#7d4459"/>
      <stop offset="1" stop-color="#c26a48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff9d5c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ff9e57"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9e57" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9e57" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .n  { font: 700 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill:#f4f7ff; letter-spacing:-1.5px; }
      .s  { font: 500 27px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill:#aebbe8; letter-spacing:0.4px; }
      .t  { font: 500 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill:#7f92cc; letter-spacing:2.6px; }
      .a1 { opacity:0; animation: up .9s cubic-bezier(.2,.9,.3,1) .25s forwards; }
      .a2 { opacity:0; animation: up .9s cubic-bezier(.2,.9,.3,1) .55s forwards; }
      .a3 { opacity:0; animation: up .9s cubic-bezier(.2,.9,.3,1) .95s forwards; }
      @keyframes up { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
      .sun { animation: rise 2.2s cubic-bezier(.25,.8,.35,1) .1s both; }
      @keyframes rise { from{transform:translateY(70px);opacity:0} to{transform:translateY(0);opacity:1} }
      .halo { transform-origin:200px 250px; animation: breathe 5.5s ease-in-out 2s infinite; }
      @keyframes breathe { 0%,100%{opacity:.75;transform:scale(1)} 50%{opacity:1;transform:scale(1.07)} }
      .st { animation: tw 3.4s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.12} 50%{opacity:.85} }
      .car { animation: bl 1.05s steps(1) infinite; }
      @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .swp { animation: sweep 7s ease-in-out 1.5s infinite; }
      @keyframes sweep { 0%,100%{opacity:.3} 50%{opacity:1} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <g fill="#dce6ff">
      <circle class="st" cx="90"  cy="46"  r="1.6" style="animation-delay:0s"/>
      <circle class="st" cx="180" cy="88"  r="1.1" style="animation-delay:.6s"/>
      <circle class="st" cx="286" cy="38"  r="1.8" style="animation-delay:1.2s"/>
      <circle class="st" cx="352" cy="104" r="1.2" style="animation-delay:.3s"/>
      <circle class="st" cx="470" cy="54"  r="1.5" style="animation-delay:1.8s"/>
      <circle class="st" cx="548" cy="96"  r="1"   style="animation-delay:.9s"/>
      <circle class="st" cx="640" cy="34"  r="1.7" style="animation-delay:2.3s"/>
      <circle class="st" cx="726" cy="80"  r="1.2" style="animation-delay:.15s"/>
      <circle class="st" cx="812" cy="48"  r="1.5" style="animation-delay:1.5s"/>
      <circle class="st" cx="900" cy="98"  r="1.1" style="animation-delay:2.7s"/>
      <circle class="st" cx="982" cy="40"  r="1.9" style="animation-delay:.45s"/>
      <circle class="st" cx="1064" cy="86" r="1.3" style="animation-delay:2s"/>
      <circle class="st" cx="1136" cy="52" r="1.5" style="animation-delay:1.1s"/>
      <circle class="st" cx="430" cy="140" r="1"   style="animation-delay:2.5s"/>
      <circle class="st" cx="1010" cy="132" r="1.1" style="animation-delay:.75s"/>
    </g>

    <g class="sun">
      <circle class="halo" cx="200" cy="250" r="150" fill="url(#glow)"/>
      <circle cx="200" cy="250" r="58" fill="url(#sunFill)"/>
    </g>

    <rect class="swp" x="0" y="249" width="1200" height="1.4" fill="url(#horizon)"/>

    <g class="a1">
      <text class="t" x="392" y="118">iOS DEVELOPER</text>
    </g>
    <g class="a2">
      <text class="n" x="390" y="188">Ziad AlHusseiny</text>
    </g>
    <g class="a3">
      <text class="s" x="392" y="232">Swift · SwiftUI · shipping small apps that people keep<tspan class="car" dx="6" fill="#ffb27a">▍</tspan></text>
    </g>
  </g>
</svg>
